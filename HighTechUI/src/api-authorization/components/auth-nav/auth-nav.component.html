@if (isAuthenticated | async) {
<ul class="navbar-nav">
	<li class="nav-item">
		<a class="nav-link text-dark"
		   [routerLink]='["/manage"]'
		   title="Manage">Hello {{ name | async }}</a>
	</li>
	<li class="nav-item">
		<a class="nav-link text-dark"
		   [routerLink]='["/authentication/logout"]'
		   [state]='{ local: true }'
		   title="Logout">Logout</a>
	</li>
</ul>
}
@if ((isAuthenticated | async) !== true) {
<ul class="navbar-nav">
	<li class="nav-item">
		<a class="nav-link text-dark"
		   [routerLink]='["/authentication/register"]'>Register</a>
	</li>
	<li class="nav-item">
		<a class="nav-link text-dark"
		   [routerLink]='["/authentication/login"]'>Login</a>
	</li>
</ul>
}
