<div class="change-password">
    <header class="change-password__header">
        <h1 class="change-password__title">Change Password</h1>
        <p class="change-password__subtitle">Update your password to keep your account secure.</p>
    </header>

    <hr class="change-password__divider"/>

    <form (submit)="changePassword(f)" #f="ngForm" ngNativeValidate class="change-password__form">
        <div class="change-password__grid">
            <div class="change-password-field change-password-field--full">
                <label class="change-password-field__label" for="oldPassword">Current Password</label>
                <input id="oldPassword"
                       class="change-password-field__input"
                       name="oldPassword"
                       type="password"
                       placeholder="Enter your current password"
                       autocomplete="current-password"
                       ngModel
                       required
                       minlength="3"/>
            </div>

            <div class="change-password-field">
                <label class="change-password-field__label" for="newPassword">New Password</label>
                <input id="newPassword"
                       class="change-password-field__input"
                       name="newPassword"
                       type="password"
                       placeholder="Enter a new password"
                       autocomplete="new-password"
                       ngModel
                       required
                       minlength="3"/>
            </div>

            <div class="change-password-field">
                <label class="change-password-field__label" for="confirmNewPassword">Confirm New Password</label>
                <input id="confirmNewPassword"
                       class="change-password-field__input"
                       name="confirmNewPassword"
                       type="password"
                       placeholder="Re-enter the new password"
                       autocomplete="new-password"
                       ngModel
                       required
                       minlength="3"/>
            </div>
        </div>

        <div class="change-password__actions">
            <button type="submit" class="change-password-btn change-password-btn--primary">Save Changes</button>
            <button type="button" class="change-password-btn change-password-btn--ghost" (click)="f.reset()">Cancel</button>
        </div>
    </form>
</div>
