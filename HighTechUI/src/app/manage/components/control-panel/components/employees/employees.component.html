<div class="">
	<div class="table-responsive">
		<table class="table table-hover text-center">
			<thead>
				<tr>
					<th>Username</th>
					<th>Email</th>
					<th>FullName</th>
					<th>Phone</th>
					<th>Job Title</th>
					<th></th>
				</tr>
			</thead>
			<tbody>
				@for (emp of employees; track emp.id) {
				<tr>
					<td>{{ emp.username }}</td>
					<td>{{ emp.email }}</td>
					<td>{{ emp.firstName + emp.lastName }}</td>
					<td>{{ emp.phoneNumber }}</td>
					<td>{{ emp.jobTitle }}</td>
					@if (emp.isAdmin) {
					<td>
						<button class="btn btn-danger"
								(click)="demote(emp)">Demote</button>
					</td>
					}
					@if (!emp.isAdmin) {
					<td>
						<button class="btn btn-success"
								(click)="promote(emp)">Promote</button>
					</td>
					}
				</tr>
				}
			</tbody>
		</table>
	</div>
</div>
